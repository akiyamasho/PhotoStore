[package]
name = "photostore-cli"
description = "Headless PhotoStore: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional photostore-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["photostore-codecs/heif"]

[lints]
workspace = true

[lib]
name = "photostore_cli"
path = "src/lib.rs"

[[bin]]
name = "photostore-cli"
path = "src/main.rs"

[dependencies]
photostore-automation = { path = "../../crates/automation" }
photostore-engine = { workspace = true }
photostore-io = { workspace = true }
photostore-format = { path = "../../crates/format" }
photostore-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# Icon + VERSIONINFO for photostore-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

