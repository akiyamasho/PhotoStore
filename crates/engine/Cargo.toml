[package]
name = "photostore-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
dev-install = []
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []

[dependencies]
photostore-geom = { workspace = true }
photostore-color = { workspace = true }
photostore-cms = { workspace = true }
photostore-raster = { workspace = true }
photostore-doc = { workspace = true }
photostore-ops = { workspace = true }
photostore-compose = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
photostore-paint = { workspace = true }
photostore-algo = { workspace = true }
photostore-text = { workspace = true }
photostore-vector = { workspace = true }
photostore-io = { workspace = true }
photostore-psd = { workspace = true }
photostore-format = { workspace = true }
photostore-plugins = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
photostore-codecs = { workspace = true }
flate2 = { workspace = true }
# Photoshop `.kys` shortcut sets (`edit.keyboardShortcuts` `importKys`); already in the tree
# through photostore-ui-egui and usvg.
roxmltree = "0.20"

[dev-dependencies]
photostore-affinity = { workspace = true, features = ["synth"] }
# Synthetic camera raw files for the open tests.
photostore-raw = { workspace = true, features = ["testgen"] }
# WebAssembly text -> binary for plug-in test modules (Apache-2.0 WITH LLVM-exception).
wat = "1.228"
